# .mira.yaml — per-repo review tuning for Mira in CI.
#
# The CI reusable workflow already supplies the endpoint, credential, model,
# and its own filter/review defaults. This file is merged OVER them, so list
# only what this repo changes. Endpoint/credential keys (llm.base_url,
# llm.api_key_env) are deliberately ignored if set here.
#
# Everything below is optional; delete the file and the workflow defaults apply.

filter:
  max_comments: 5

# O gate do CI falha com status=partial (chunk do diff respondido em prosa).
# O minimax-m3 descartou 1 chunk em 2 runs seguidas deste PR (run 36012771256);
# qwen3.8-flash é da família distinta do implementador (regra do workflow) e
# respeita o formato tool_choice. O fallback-model do workflow (qwen3.8-flash)
# continua valendo para o modelo primário de review.
llm:
  review_model: qwen3.8-flash

review:
  # walkthrough false: minimax-m3 degrada tool-call→prose quando o prompt exige
  # muito output (walkthrough extenso + diff grande) — ver skill mira-code-review.
  walkthrough: false
  include_summary: true
  context_lines: 5
